# Synced from ~/Sites/mossyleaf-studio/toolchain: edit it there, then run its ./sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dev-stack
        with:
          save-cache: 'true'

      - uses: actions/cache@v4
        with:
          path: |
            var/cache/phpstan
            var/.php-cs-fixer.cache
            .deptrac.cache
          key: lint-${{ github.sha }}
          restore-keys: lint-

      - run: make ci-build ci-warmup

      - run: make -j4 --output-sync=target ci-checks

      - if: always()
        run: docker compose down --volumes

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: shard-1, args: --shard=1/3 }
          - { name: shard-2, args: --shard=2/3 }
          - { name: shard-3, args: --shard=3/3 }
    name: e2e (${{ matrix.part.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dev-stack

      - run: make ci-build

      - run: make ci-e2e PLAYWRIGHT_ARGS="${{ matrix.part.args }}"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.part.name }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - if: always()
        run: docker compose --profile e2e down --volumes

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$(make -s print-IMAGE)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.tag.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=prod
            type=gha,scope=dev
          cache-to: type=gha,scope=prod,mode=max

  publish:
    needs: [checks, e2e, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # IMAGE is read again here: GitHub drops a job output that contains a secret (the Docker Hub user).
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: IMAGE=$(make -s print-IMAGE) && docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
        env:
          TAG: ${{ needs.image.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
